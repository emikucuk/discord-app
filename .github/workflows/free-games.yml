name: Free Games Notifier

on:
  schedule:
    # Her 1440 dakikada bir (günde 1) — 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-games-notifier
  cancel-in-progress: false

jobs:
  notify:
    name: Check & notify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/free-games

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run free-games checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm start

      - name: Commit seen state
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/free-games/data/seen.json
          if git diff --staged --quiet; then
            echo "seen.json değişmedi"
          else
            git commit -m "chore(free-games): görülen oyun listesini güncelle"
            git push
          fi
